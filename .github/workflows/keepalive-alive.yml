name: keep workflow alive

# GitHub 会在 60 天无提交后自动禁用 scheduled workflow。
# 这个任务每周写一次时间戳，让仓库保持"有活动"，主看门狗就不会被停。
on:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 更新时间戳
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > last-active
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-active
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "keepalive: $(date -u +%F)"
            git push
          fi
