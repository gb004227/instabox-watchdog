name: instabox keepalive（单次手动）

# 只保留手动触发：真正长期跑的是 watchdog-loop.yml 的自接力任务。
# 这里留一个单次执行的入口，方便随时验证一次状态。
# 注意：本仓库的 schedule 触发器实测完全不执行，所以这里不放 cron，
# 免得将来 schedule 突然生效、两个 worker 同时 suspend/start 打架。
on:
  workflow_dispatch:
    inputs:
      reset_now:
        description: "立即重置计时器（主动 suspend + start）"
        type: boolean
        default: false

# 同一时间只跑一个，避免两轮同时 suspend/wake 打架
concurrency:
  group: instabox-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - name: 保活 / 重置计时器
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE: ${{ vars.INSTABOX_MACHINE || 'box-1' }}
          # 不要在这里写死阈值：maxRunMinutes 是 120 起步的，写死 300 会被平台真暂停
          # 留空 = 由脚本按 maxRunMinutes - LEAD_MIN 动态算
          LEAD_MIN: ${{ vars.LEAD_MIN || '20' }}
          SETTLE_SEC: ${{ vars.SETTLE_SEC || '90' }}
        run: |
          set -o pipefail
          chmod +x scripts/watchdog.sh
          # 手动触发时把阈值降到 0，强制走一次 suspend + wake
          if [ "${{ inputs.reset_now }}" = "true" ]; then
            export RESET_AFTER_MIN=0
          fi
          bash scripts/watchdog.sh
